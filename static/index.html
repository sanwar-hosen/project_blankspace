<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blankspace · A quiet place to put words</title>
<meta name="description" content="Blankspace is a free, distraction-free writing app that works offline and syncs across your devices. Coming soon.">
<link id="icon" rel="icon" href="favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Blankspace">
<meta property="og:title" content="Blankspace · A quiet place to put words">
<meta property="og:description" content="A free, distraction-free writing app that works offline and syncs across your devices. Coming soon.">
<meta property="og:image" content="og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&family=Newsreader:wght@400&display=swap">
<style>
:root,[data-m=paper]{--bg:#f7f2e8;--t:#241d14;--mu:#6b5d4a;--p:#3d2e1c;--pf:#fbf7ef;--a:#c2410c}
[data-m=midnight]{--bg:#0b1020;--t:#eef2ff;--mu:#8a96b8;--p:#7c9cff;--pf:#0b1020;--a:#7c9cff}
[data-m=rose]{--bg:#fff7f7;--t:#2b0f17;--mu:#8a5563;--p:#be123c;--pf:#fff;--a:#e11d48}
[data-m=forest]{--bg:#0f1a14;--t:#effaf2;--mu:#8aa596;--p:#6ee7a8;--pf:#0b1510;--a:#6ee7a8}
[data-m=dusk]{--bg:#1a1424;--t:#faf5ff;--mu:#a796be;--p:#d8b4fe;--pf:#1a1424;--a:#e879f9}
[data-m=light]{--bg:#fff;--t:#09090b;--mu:#52525b;--p:#0a0a0a;--pf:#fafafa;--a:#6366f1}
@media(prefers-color-scheme:dark){:root:not([data-m]){--bg:#0b1020;--t:#eef2ff;--mu:#8a96b8;--p:#7c9cff;--pf:#0b1020;--a:#7c9cff}}

*{margin:0;box-sizing:border-box}
body{min-height:100svh;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(24px,5vw,56px);background:var(--bg);color:var(--t);font:600 20px Geist,system-ui,sans-serif;-webkit-font-smoothing:antialiased;cursor:pointer}

.brand{display:flex;align-items:center;gap:14px;width:fit-content;letter-spacing:-.02em}
.mark{--u:.64px;position:relative;width:calc(56*var(--u));height:calc(56*var(--u))}
.tile{position:absolute;inset:0;border-radius:calc(16*var(--u));transition:transform .7s cubic-bezier(.32,.72,0,1)}
.back{background:var(--a);opacity:.3}
.front{background:var(--p);display:grid;place-items:center}
.front::after{content:"";width:calc(3*var(--u));height:calc(24*var(--u));border-radius:calc(2*var(--u));background:var(--pf);animation:blink 1.1s step-end infinite}
.brand:hover .back{transform:translate(calc(6*var(--u)),calc(-2*var(--u))) rotate(14deg)}
.brand:hover .front{transform:rotate(-8deg) scale(1.05)}

h1{font:400 clamp(32px,4.6vw,60px)/1.12 Newsreader,Georgia,serif;letter-spacing:-.01em}
h1::after{content:"";display:inline-block;width:.07em;height:.85em;margin-left:.12em;vertical-align:-.08em;background:var(--a);animation:blink 1.1s step-end infinite}
p{margin-top:20px;font:400 16px Geist,system-ui,sans-serif;color:var(--mu)}
.hint{position:fixed;right:clamp(24px,5vw,56px);bottom:clamp(24px,5vw,56px);margin:0;font-size:14px;display:flex;align-items:center;gap:8px}
.hint::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--a)}
main{animation:rise .75s cubic-bezier(.16,1,.3,1) both}

@keyframes blink{50%{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes reveal{from{clip-path:circle(0 at var(--x) var(--y))}to{clip-path:circle(150vmax at var(--x) var(--y))}}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-new(root){animation:reveal .7s cubic-bezier(.65,0,.35,1)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="brand">
  <span class="mark" role="img" aria-label="Blankspace logo"><span class="tile back"></span><span class="tile front"></span></span>
  Blankspace
</header>
<main>
  <h1>A quiet place to put words.</h1>
  <p>Coming soon</p>
</main>
<p class="hint">Pick a mood</p>
<script>
const r=document.documentElement,m=["paper","midnight","rose","forest","dusk","light"];
let i=matchMedia("(prefers-color-scheme:dark)").matches?1:0;
addEventListener("click",e=>{
  const go=()=>{
    r.dataset.m=m[i=++i%m.length];
    const s=getComputedStyle(r),c=n=>s.getPropertyValue(n).trim();
    icon.href="data:image/svg+xml,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect x="13" y="11" width="42" height="42" rx="11" fill="${c("--a")}" opacity=".35" transform="rotate(14 34 32)"/><rect x="9" y="11" width="42" height="42" rx="11" fill="${c("--p")}" transform="rotate(-9 30 32)"/><rect x="27.5" y="21" width="5" height="22" rx="2.5" fill="${c("--pf")}" transform="rotate(-9 30 32)"/></svg>`);
  };
  r.style.setProperty("--x",e.clientX+"px");r.style.setProperty("--y",e.clientY+"px");
  document.startViewTransition?document.startViewTransition(go):go();
});
</script>
</body>
</html>
